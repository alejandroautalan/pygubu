[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pygubu"
version="0.42.1"
description = "A simple GUI builder for the python tkinter module"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["gui", "tkinter", "designer"]
authors = [
  { name = "Alejandro Autalan", email = "alejandroautalan@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "importlib_metadata >= 3.6;python_version<'3.10'",
]

[project.urls]
Documentation = "https://github.com/alejandroautalan/pygubu#readme"
Issues = "https://github.com/alejandroautalan/pygubu/issues"
Source = "https://github.com/alejandroautalan/pygubu"

[project.optional-dependencies]
ttkwidgets = ['ttkwidgets']
tksheet = ['tksheet']
tkinterweb = ['tkinterweb']
tkintertable = ['tkintertable']
tkcalendar = ['tkcalendar']
awesometkinter = ['AwesomeTkinter']
customtkinter = ['customtkinter >=5.2.2', 'packaging', 'pillow']
tkintermapview = ['tkintermapview']
all = [
  'AwesomeTkinter',
  'tkintertable',
  'tksheet',
  'ttkwidgets',
  'tkinterweb',
  'tkcalendar',
  'customtkinter >=5.2.2', 'packaging', 'pillow',
  'tkintermapview']

[project.entry-points."pyinstaller40"]
hook-dirs = "pygubu.__pyinstaller:get_hook_dirs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"] # Ajusta según tu versión de Python (ej. py310, py312)

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203", # Espacios antes de ':' en slices (requerido por PEP 8, pero Black lo formatea distinto)
    "W503", # Salto de línea antes de operador binario (regla antigua reemplazada por W504)
]
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]
